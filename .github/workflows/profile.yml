name: Profile README assets

# Generates the GitHub statistics cards and the contribution snake used by README.md.
# Place this file in the profile repository (sana-uzumaki/sana-uzumaki) at .github/workflows/profile.yml

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  summary-cards:
    name: Generate profile summary cards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: vn7n24fzkq/github-profile-summary-cards@release/4
        env:
          # Optional but recommended: a personal access token (classic) with read:user and repo scopes,
          # saved as a repository secret named METRICS_TOKEN. Falls back to the default token if absent.
          GITHUB_TOKEN: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
        with:
          USERNAME: ${{ github.repository_owner }}
          THEMES: "nord_dark"
