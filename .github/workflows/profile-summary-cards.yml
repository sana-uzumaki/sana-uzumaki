name: Profile Summary Cards

on:
  # Refresh the cards every day at 00:00 UTC
  schedule:
    - cron: "0 0 * * *"
  # Adds a "Run workflow" button in the Actions tab (use it for the first run)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    name: Generate GitHub summary cards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: vn7n24fzkq/github-profile-summary-cards@release
        env:
          # The built-in token covers public activity. See the notes below
          # if you want private contributions included.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          USERNAME: ${{ github.repository_owner }}
          BRANCH_NAME: main
