name: Profile README assets

# Generates the GitHub statistics cards and the contribution snake used by README.md.
# Place this file in sana-uzumaki/sana-uzumaki at .github/workflows/profile.yml

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  summary-cards:
    name: Generate profile summary cards
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: vn7n24fzkq/github-profile-summary-cards@release/4
        env:
          # Optional: a personal access token (classic) with read:user and repo scopes,
          # saved as a repository secret named METRICS_TOKEN. Falls back to the default token.
          GITHUB_TOKEN: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
        with:
          USERNAME: sana-uzumaki
          THEMES: "nord_dark"

  snake:
    name: Generate contribution snake
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: sana-uzumaki
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
